name: Validate Sonio Insights
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sonio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sonio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonio -d sonio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sonio:ci-only-password@localhost:5432/sonio_test
      DATABASE_URL: postgresql+psycopg://sonio:ci-only-password@localhost:5432/sonio_test
      ENVIRONMENT: test
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://testserver
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check . && pytest -q
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.3.0
        with:
          context: backend
          push: false
      - uses: docker/build-push-action@v7.3.0
        with:
          context: frontend
          push: false
